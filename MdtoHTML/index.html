<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD → GitHub HTML 转换器</title>
<link rel="icon" type="image/x-icon" href="Icon.ico">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown-light.css">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="container">
  <div class="panel">
    <div class="header">Markdown 输入</div>
    <textarea id="editor" placeholder="输入 Markdown…"></textarea>
    <div class="controls">
      <button onclick="downloadHtml()">下载 HTML</button>
      <button onclick="copyHtml()">复制 HTML</button>
      <button onclick="clearAll()">清空</button>
      <a href="mhsetup.exe" class="text-center" style="margin-left:auto;padding:6px 12px;background:#2da44e;color:white;border:none;border-radius:6px;text-decoration:none;display:inline-block;">下载安装程序（.exe)</a>
      <button id="download-msi-btn" onclick="downloadMergedMsi()">下载安装程序（.msi）</button>
      <a href="mhsetup-old.exe" class="text-center" style="padding:6px 12px;background:#6e7681;color:white;border:none;border-radius:6px;text-decoration:none;display:inline-block;">下载旧版安装程序（.exe)</a>
    </div>
  </div>
  <div class="panel">
    <div class="header">GitHub 风格预览</div>
    <div id="preview" class="markdown-body"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
